<style>
  /* Plantilla "mock de celular" (base-compartida/33) con la paleta de RepareHoy: madera oscura y naranja. */
  :root {
    --bg: #1F1510; --panel: #2B1E17; --panel-2: #3A2A20; --line: #4A3628;

    --warn: #F59E0B; --marco: #0E0906; --pantalla: #17100C; --sub: #FBBF24;
    --display: 'Sora', 'Segoe UI', system-ui, sans-serif; --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #FBF6EF; --panel: #FFFFFF; --panel-2: #F3EBDF; --line: #E2D6C6; --fg: #231A14; --muted: #5E5046; --accent: #C9450A; --accent-ink: #FFFFFF; --warn: #A66A00; --marco: #231A14; --pantalla: #2B1E17; --sub: #FBBF24; color-scheme: light; } }
  :root[data-theme="light"] { --bg: #FBF6EF; --panel: #FFFFFF; --panel-2: #F3EBDF; --line: #E2D6C6; --fg: #231A14; --muted: #5E5046; --accent: #C9450A; --accent-ink: #FFFFFF; --warn: #A66A00; --marco: #231A14; --pantalla: #2B1E17; --sub: #FBBF24; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.1; letter-spacing: -0.02em; }
  p { margin: 0; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .lead { color: var(--muted); max-width: 64ch; }
  header { display: flex; flex-direction: column; gap: 10px; }
  .pestanas { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .pestanas button, .vista button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 9px 15px; font: 600 13.5px var(--display); cursor: pointer; white-space: nowrap; }
  .pestanas button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .vista { display: flex; gap: 8px; }
  .vista button { font-size: 12.5px; padding: 7px 13px; }
  .vista button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
  .ficha { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .ficha .origen { color: var(--muted); font-size: 13.5px; }
  .ficha .idea { font-size: 14.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
  .chip b { color: var(--fg); }
  .tira { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; scrollbar-width: thin; }
  .paso { flex: 0 0 auto; width: min(260px, 78vw); scroll-snap-align: center; display: flex; flex-direction: column; gap: 10px; }
  .paso .cab { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .paso .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700; font-size: 14px; display: grid; place-items: center; flex-shrink: 0; }
  .paso h3 { font-size: 14.5px; line-height: 1.25; }
  .paso h3 small { display: block; font-family: var(--body); font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .paso .nota { font-size: 13px; color: var(--muted); }
  .puntos { display: flex; justify-content: center; gap: 7px; }
  .puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .puntos i.on { background: var(--accent); }
  @media (min-width: 900px) { .tira { flex-wrap: wrap; overflow: visible; scroll-snap-type: none; } .puntos { display: none; } }
  .fono { background: var(--marco); border-radius: 36px; padding: 8px; box-shadow: 0 18px 40px rgba(0, 0, 0, .35); }
  .vidrio { background: var(--pantalla); border-radius: 29px; overflow: hidden; aspect-ratio: 9 / 16; position: relative; color: #FBF6EF; }
  .vidrio img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* escena filmada, descrita */
  .esc { position: absolute; inset: 0; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; background: radial-gradient(90% 60% at 50% 20%, #4A3628 0%, #17100C 75%); }
  .esc .plano { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #FBF6EF; border: 1px solid rgba(251,246,239,.4); border-radius: 999px; padding: 3px 9px; display: flex; gap: 6px; align-items: center; }
  .esc .quien { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.2; }
  .esc .accion { font-size: 13px; color: #E9DCCD; line-height: 1.4; }
  .esc .flow { margin-top: auto; align-self: flex-start; font-size: 10.5px; color: #C9B8A8; display: flex; gap: 5px; align-items: center; }
  .sub { position: absolute; left: 10px; right: 10px; bottom: 34px; background: rgba(22,16,34,.72); border-radius: 12px; padding: 7px 10px; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.3; color: #fff; }
  .sub.vacio { color: #C9B8A8; font-weight: 500; font-style: italic; }
  .real { position: absolute; top: 10px; left: 10px; font-size: 10.5px; font-weight: 700; background: rgba(0,0,0,.6); border-radius: 999px; padding: 3px 9px; }
  .pant-nombre { position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 11px; font-weight: 600; text-align: center; background: rgba(0,0,0,.6); border-radius: 999px; padding: 4px 8px; }
  .placa { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 18px; text-align: center; background: radial-gradient(70% 45% at 50% 30%, #EE5A0E55 0%, #1F1510 70%); }
  .placa .marca { font-family: var(--display); font-weight: 700; font-size: 22px; } .placa .marca b { color: #EE5A0E; }
  .placa .linea { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .placa .web { background: #EE5A0E; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
  svg.ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .prompts { display: flex; flex-direction: column; gap: 12px; }
  .pr { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .pr-h { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; font-family: var(--display); }
  .pr pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); }
  .cp { border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: 600 12px var(--body); cursor: pointer; }
  .gente { display: flex; flex-wrap: wrap; gap: 8px; }
  .gente div { background: var(--panel-2); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  .gente b { font-family: var(--display); }
</style>
</head>

    Array.prototype.forEach.call(document.getElementById('vista').children, function (b) { b.setAttribute('aria-selected', String(b.dataset.v === vista)); });
    ficha.innerHTML = '<p class="origen">' + esc(p.origen) + '</p>' + (p.idea ? '<p class="idea">' + esc(p.idea) + '</p>' : '') +
      '<div class="chips"><span class="chip"><b>' + p.pasos.length + '</b> escenas</span><span class="chip">dura <b>' + p.suma + ' s</b> (objetivo ' + p.dur + ' s)</span><span class="chip"><b>' + p.flow.length + '</b> pedidos a Flow</span></div>' +
      '<div class="gente">' + p.personajes.map(function (x) { return '<div><b>' + esc(x.nombre) + '</b> · ' + esc(x.rol) + '<br>' + esc(x.fisico) + (x.ropa ? ' · ' + esc(x.ropa) : '') + '</div>'; }).join('') + '</div>';
    if (vista === 'sb') {
      cuerpo.innerHTML = '<div class="tira" id="tira">' + p.pasos.map(function (s, i) {
        return '<article class="paso"><div class="cab"><span class="n">' + (i + 1) + '</span><h3>' + esc(s.titulo) + '<small>' + esc(s.dur) + '</small></h3></div><div class="fono"><div class="vidrio">' + pantalla(s.pantalla) + '</div></div><p class="nota">' + esc(s.nota) + '</p></article>';
      }).join('') + '</div>';
      puntos.innerHTML = p.pasos.map(function (_, i) { return '<i class="' + (i === 0 ? 'on' : '') + '"></i>'; }).join('');
      var tira = document.getElementById('tira');
      tira.addEventListener('scroll', function () {
        var medio = tira.scrollLeft + tira.clientWidth / 2, mejor = 0, dist = Infinity;
        Array.prototype.forEach.call(tira.children, function (el, i) { var d = Math.abs(el.offsetLeft - tira.offsetLeft + el.offsetWidth / 2 - medio); if (d < dist) { dist = d; mejor = i; } });
        Array.prototype.forEach.call(puntos.children, function (el, i) { el.className = i === mejor ? 'on' : ''; });
      }, { passive: true });
    } else {
      puntos.innerHTML = '';
      cuerpo.innerHTML = '<div class="prompts">' + (p.flow.length ? p.flow.map(function (f, i) { return '<div class="pr"><div class="pr-h"><span>Escena ' + f.escena + '</span><button class="cp" type="button" data-i="' + i + '">Copiar</button></div><pre>' + esc(f.prompt) + '</pre></div>'; }).join('') : '<p class="lead">No hay pedidos a Flow.</p>') + '</div>';
      Array.prototype.forEach.call(cuerpo.querySelectorAll('.cp'), function (b) {
        b.addEventListener('click', function () { var t = p.flow[Number(b.dataset.i)].prompt; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'Copiado'; }, function () { b.textContent = 'Seleccioná y copiá'; }); setTimeout(function () { b.textContent = 'Copiar'; }, 1800); });
      });
    }
  }
  pest.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; actual = Number(b.dataset.i); vista = 'sb'; pintar(); window.scrollTo(0, 0); });
  document.getElementById('vista').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; vista = b.dataset.v; pintar(); });
  pintar();
</script>
</body>
</html>
