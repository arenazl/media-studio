<title>Radiografía Munify ayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: pestañas arriba (resumen + un paso por pestaña); cada paso baja en tres bloques: de qué se alimentó,
     qué salió y qué hizo con el kit. Colores de origen: kit verde, paso anterior azul, creativo violeta, imaginado naranja. */
  :root{
    --noche:#0A1729; --panel:#11253F; --panel-2:#0D1E35; --panel-3:#162C4C; --linea:#1D3A5C; --linea-suave:#16304E;
    --tinta:#E8EFF9; --tinta-2:#94ABC8; --tinta-3:#7088A8; --marca:#2D7FF9;
    --kit:#22C55E; --anterior:#38BDF8; --creativo:#A78BFA; --imaginado:#FF8A3D; --alerta:#FF5A5F;
    --estatico:#64748B; --preset:#818CF8; --dinamico:#E2C044;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--noche);color:var(--tinta);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
  h1,h2,h3{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-weight:700;text-wrap:balance;margin:0}
  p{margin:0}
  .barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,23,41,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea-suave)}
  .barra .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-block:8px}
  .logo{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:18px}
  .logo svg{width:22px;height:22px}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{font:inherit;font-size:13px;font-weight:600;color:var(--tinta-2);background:transparent;border:1px solid var(--linea);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .tab[aria-selected="true"]{background:var(--marca);border-color:var(--marca);color:#fff}
  .tab .n{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--alerta);color:#fff;border-radius:999px;padding:0 6px}
  .tab:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
  .hero{padding-block:20px 6px}
  .hero h1{font-size:clamp(24px,4.6vw,34px);line-height:1.1}
  .hero p{margin-top:8px;color:var(--tinta-2);max-width:74ch}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12.5px;border:1px solid var(--linea);border-radius:999px;padding:3px 10px;color:var(--tinta-2)}
  .chip b{color:var(--tinta)}
  .bloque{margin-top:18px;background:var(--panel-2);border:1px solid var(--linea-suave);border-radius:12px;padding:16px}
  .bloque h2{font-size:20px}
  .bloque .sub{color:var(--tinta-2);font-size:14px;margin-top:4px;max-width:74ch}
  .eti{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}
  .filas{display:grid;gap:12px;margin-top:12px}
  .fila{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
  @media (max-width:720px){.fila{grid-template-columns:minmax(0,1fr)}}
  .fila .nom{font-weight:700}
  .barra2{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--panel-3)}
  .barra2 i{display:block;height:100%}
  .leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11.5px;color:var(--tinta-3)}
  .leyenda span{display:flex;align-items:center;gap:5px}
  .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .num{background:var(--noche);border:1px solid var(--linea);border-radius:10px;padding:12px}
  .num .v{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;line-height:1}
  .num p{font-size:13px;color:var(--tinta-2);margin-top:6px}
  .grupos{display:grid;gap:10px;margin-top:12px}
  .grupo .t{font-size:12px;color:var(--tinta-3);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .hs{display:flex;flex-wrap:wrap;gap:6px}
  .h{font-size:12.5px;border-radius:999px;padding:3px 10px;border:1px solid var(--linea)}
  .h.usado{border-color:var(--kit);color:#C7F5D7}
  .h.ignorado{color:var(--tinta-3);text-decoration:line-through;text-decoration-color:rgba(148,171,200,.5)}
  .h.no-llego{border-style:dashed;color:var(--imaginado)}
  .alertas{margin:10px 0 0;padding-left:18px}
  .alertas li{font-size:14px;margin-bottom:6px}
  .alertas li b{color:#FFB4B6}
  .capas{display:grid;gap:6px;margin-top:10px}
  .capa{display:grid;grid-template-columns:minmax(0,1.3fr) 70px minmax(0,1fr);gap:10px;align-items:center;background:var(--noche);border:1px solid var(--linea);border-left-width:4px;border-radius:8px;padding:8px 10px}
  @media (max-width:640px){.capa{grid-template-columns:minmax(0,1fr) 60px}.capa .uso{grid-column:1 / -1}}
  .capa .tt{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
  .capa .pal{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--tinta-3);text-align:right}
  .uso{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--tinta-2)}
  .uso .b{flex:1;height:8px;background:var(--panel-3);border-radius:4px;overflow:hidden}
  .uso .b i{display:block;height:100%;background:var(--kit)}
  .frases{display:grid;gap:8px;margin-top:10px}
  .frase{background:var(--noche);border:1px solid var(--linea);border-left-width:5px;border-radius:8px;padding:10px 12px;min-width:0}
  .frase .cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--tinta-3);font-family:'IBM Plex Mono',monospace}
  .frase .orig{font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .frase .tx{font-size:14.5px;margin-top:4px;overflow-wrap:anywhere}
  .frase .al{margin-top:6px;font-size:13px;color:#FFB4B6}
  .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px}
  .caja{background:var(--noche);border:1px solid var(--linea);border-radius:10px;padding:12px;min-width:0}
  .caja h3{font-size:15px;margin-bottom:6px}
  .caja p, .caja li{font-size:13.5px;color:var(--tinta-2)}
  .caja ul{margin:0;padding-left:18px}
  .aviso{margin-top:10px;font-size:13px;color:#F3DFAE;border:1px solid #5a4416;background:#1d1a10;border-radius:8px;padding:8px 10px}
  .plan{display:grid;gap:8px;margin-top:10px}
  .pm{display:grid;grid-template-columns:150px minmax(0,1fr) 90px 90px;gap:10px;align-items:center;background:var(--noche);border:1px solid var(--linea);border-radius:8px;padding:8px 10px;font-size:13.5px}
  @media (max-width:720px){.pm{grid-template-columns:minmax(0,1fr) 80px 80px}.pm .d{grid-column:1 / -1;order:3}}
  .pm .ok{color:var(--kit);font-weight:700}.pm .no{color:var(--alerta);font-weight:700}.pm .na{color:var(--tinta-3)}
  footer{padding-block:22px 40px}
  footer .txt{font-size:13px;color:var(--tinta-3);max-width:72ch}
</style>

doEn": ["script"], "llegoA": ["concept", "script"], "estado": "usado"}, {"id": "h20", "grupo": "dolor", "etiqueta": "Dolor 5", "texto": "Mis datos estan seguros?", "usadoEn": [], "llegoA": ["concept"], "estado": "ignorado"}, {"id": "h21", "grupo": "oferta", "etiqueta": "Reclamos vecinales", "texto": "Reclamos vecinales El vecino reporta problemas (bache, alumbrado, residuos, animales sueltos, ruidos) desde la app con foto y GPS. La IA lo deriva a la dependencia correcta, el supervisor lo asigna a una cuadrilla, se resuelve con foto antes/despues y el vecino recibe notificacion en cada paso con numero de seguimiento.", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h22", "grupo": "oferta", "etiqueta": "Tramites municipales online", "texto": "Tramites municipales online El vecino inicia tramites desde el celular (habilitacion comercial, libre deuda, certificado de domicilio, licencia de conducir, monotributo municipal, bromatologia, permiso de obra), sube la documentacion, paga online y firma digital cuando corresponde, sin pisar el municipio hasta la entrega.", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h23", "grupo": "oferta", "etiqueta": "Turnos y agenda presencial", "texto": "Turnos y agenda presencial El vecino saca turno para gestiones que requieren presencia (mesa de entradas, licencias, bromatologia) eligiendo dependencia, dia y horario disponible. El municipio configura cupos, horarios y feriados; cada dependencia ve su agenda diaria.", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h24", "grupo": "oferta", "etiqueta": "Gestion Financiera (Contaduria + Tesoreria + Sueldos)", "texto": "Gestion Financiera (Contaduria + Tesoreria + Sueldos) Reemplaza el Excel del municipio. Contaduria maneja el circuito formal de Ordenes de Pago con trazabilidad para el Tribunal de Cuentas; Tesoreria registra los movimientos reales y saldos de cada caja; Sueldos liquida al personal con monto editable y premios variables. Los tres sub-modulos comparten la misma base de datos.", "usadoEn": ["concept"], "llegoA": ["concept", "script"], "estado": "usado"}, {"id": "h25", "grupo": "oferta", "etiqueta": "Precio u oferta", "texto": "La app es gratis para el vecino. El municipio paga por habitante, en pesos argentinos, sin permanencia. El precio exacto lo confirma un asesor del equipo segun el tamano del municipio.", "usadoEn": ["concept"], "llegoA": ["concept", "script"], "estado": "usado"}, {"id": "h26", "grupo": "oferta", "etiqueta": "Promoción 1", "texto": "Combo 3 modulos (Reclamos + Tramites + Gestion Financiera): 3 meses gratis sin compromiso ni tarjeta de credito, precio combinado menor a la suma de los modulos sueltos, capacitacion incluida e implementacion en 1 a 2 semanas.", "usadoEn": ["script"], "llegoA": ["concept", "script"], "estado": "usado"}, {"id": "h27", "grupo": "respuesta", "etiqueta": "Respuesta a una objeción 1", "texto": "Munify se integra via API y no obliga a tirar nada de lo que ya tienen. Lo distinto: app gratis para el vecino, validacion RENAPER y los modulos integrados en uno solo.", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h28", "grupo": "respuesta", "etiqueta": "Respuesta a una objeción 2", "texto": "Por eso ofrecemos 3 meses gratis sin tarjeta de credito. El municipio prueba con datos reales y recien decide cuando ve los resultados.", "usadoEn": [], "llegoA": ["concept", "script", "storyboard"], "estado": "ignorado"}, {"id": "h29", "grupo": "respuesta", "etiqueta": "Respuesta a una objeción 3", "texto": "La capacitacion esta incluida y la hacemos por videollamada con cada equipo. La curva es de un dia. Esta pensado para que lo use un empleado municipal sin saber de informatica.", "usadoEn": [], "llegoA": ["concept"], "estado": "ignorado"}, {"id": "h30", "grupo": "respuesta", "etiqueta": "Respuesta a una objeción 4", "texto": "Para eso esta el Mostrador asistido: el operador de la municipalidad carga el tramite del vecino y le hace la validacion biometrica con el celular. El vecino no necesita tener la app instalada.", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h31", "grupo": "respuesta", "etiqueta": "Respuesta a una objeción 5", "texto": "Si. Cumplimos la Ley 25.326 de Proteccion de Datos Personales. Cada municipio tiene sus datos aislados, cifrados, en cloud, con backups diarios. La data es del municipio y la pueden exportar cuando quieran.", "usadoEn": [], "llegoA": ["concept"], "estado": "ignorado"}, {"id": "h32", "grupo": "pantalla", "etiqueta": "Dashboard municipal", "texto": "Dashboard municipal Resumen y metricas", "usadoEn": [], "llegoA": ["concept"], "estado": "ignorado"}, {"id": "h33", "grupo": "pantalla", "etiqueta": "Reclamos vecinales", "texto": "Reclamos vecinales Gestionar todos los reclamos", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h34", "grupo": "pantalla", "etiqueta": "Tramites municipales", "texto": "Tramites municipales Gestionar tramites", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}, {"id": "h35", "grupo": "pantalla", "etiqueta": "Tesoreria - Pagos", "texto": "Tesoreria - Pagos Gastos cargados del municipio", "usadoEn": [], "llegoA": ["concept"], "estado": "ignorado"}, {"id": "h36", "grupo": "pantalla", "etiqueta": "Agenda de turnos", "texto": "Agenda de turnos Agenda diaria de turnos presenciales", "usadoEn": [], "llegoA": ["concept", "script"], "estado": "ignorado"}], "noDecir": ["No inventar precios ni dar montos cerrados; el precio exacto lo cierra un asesor humano segun el tamano del municipio.", "No afirmar que somos un sistema contable completo ni que emitimos facturacion electronica AFIP; convivimos con SIPAF/RAFAM y sistemas provinciales via API, no los reemplazamos.", "No presentar Sueldos como un sistema de RRHH completo: liquida base + premios, no calcula aportes/retenciones ni controla asistencia ni legajos.", "No presentarlo como un GIS profesional (catastro, planos urbanisticos) ni como un CRM generico; es exclusivo para gobiernos locales argentinos.", "No prometer integraciones especificas (SIPAF, RAFAM, etc.) sin confirmar; el equipo tecnico valida el caso puntual.", "No comparar directamente con competidores por nombre.", "Si un dato del municipio viene vacio, no inventarlo: decir que no lo tiene.", "No usar emojis ni jerga de marketing (revolucionario, increible, potencia, boostea)."], "plan": null, "resumen": {"hechos": {"total": 36, "usados": 7, "ignorados": 29, "noLlegaron": 0}, "alertas": 3, "costo": 0.391}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('datos').textContent);
  var COL = { kit: 'var(--kit)', anterior: 'var(--anterior)', creativo: 'var(--creativo)', imaginado: 'var(--imaginado)', estatico: 'var(--estatico)', preset: 'var(--preset)', dinamico: 'var(--dinamico)' };
  var ORIG = { kit: 'sale del kit', anterior: 'sale de un paso anterior', creativo: 'invención creativa', imaginado: 'lo imaginó' };
  var NAT = { estatico: 'fijo del molde', preset: 'lo que se eligió', dinamico: 'datos de la app y pasos anteriores' };
  var EST = { usado: 'lo usó', ignorado: 'le llegó y no lo usó', 'no-llego': 'no le llegó' };
  var S = { tab: 'resumen' };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function barra(partes) { var t = partes.reduce(function (s, p) { return s + p[1]; }, 0) || 1; return '<div class="barra2">' + partes.map(function (p) { return p[1] ? '<i style="width:' + (p[1] / t * 100) + '%;background:' + COL[p[0]] + '" title="' + esc(p[0]) + '"></i>' : ''; }).join('') + '</div>'; }
  function ley(keys, nombres) { return '<div class="leyenda">' + keys.map(function (k) { return '<span><i class="sw" style="background:' + COL[k] + '"></i>' + esc(nombres[k]) + '</span>'; }).join('') + '</div>'; }

  function tabs() {
    var t = [['resumen', 'Resumen', 0]].concat(D.pasos.map(function (p) { return [p.id, p.label, p.alertas]; }));
    if (D.plan) t.push(['plan', 'Contra el plan', 0]);
    document.getElementById('tabs').innerHTML = t.map(function (x) { return '<button type="button" class="tab" role="tab" id="tab-' + x[0] + '" data-tab="' + x[0] + '" aria-selected="' + (S.tab === x[0]) + '">' + esc(x[1]) + (x[2] ? '<span class="n">' + x[2] + '</span>' : '') + '</button>'; }).join('');
    document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { S.tab = b.getAttribute('data-tab'); pintar(); window.scrollTo({ top: 0 }); }); });
  }

  function resumen() {
    var R = D.resumen;
    var h = '<div class="hero"><span class="eti">' + esc(D.proyecto.nombre) + ' · ' + esc(D.pieza.tipo) + (D.pieza.formatoId ? ' · ' + esc(D.pieza.formatoId) : '') + '</span><h1>' + esc(D.pieza.titulo) + '</h1>';
    h += '<p>Qué armó el código, qué escribió la IA, qué usó del kit, qué ignoró y qué imaginó, paso por paso hasta el storyboard. Nada de esto llamó a la IA: es la lectura de lo que ya pasó.</p>';
    h += '<div class="chips">' + (D.pieza.enfoque ? '<span class="chip">Enfoque <b>' + esc(D.pieza.enfoque) + '</b></span>' : '') + (D.pieza.tratamiento ? '<span class="chip">Tratamiento <b>' + esc(D.pieza.tratamiento) + '</b></span>' : '') + '<span class="chip">Costo de la IA <b>USD ' + R.costo + '</b></span></div></div>';
    h += '<div class="bloque"><h2>Cuánto es código y cuánto es IA</h2><p class="sub">A la izquierda, el prompt que armó el código para cada paso, por origen. A la derecha, lo que escribió la IA, frase por frase, según de dónde sale.</p><div class="filas">' +
      D.pasos.map(function (p) {
        var n = p.palabrasPorNaturaleza;
        return '<div class="fila"><span class="nom">' + esc(p.label) + '</span><div><div class="eti">el código armó ' + p.palabrasPrompt + ' palabras</div>' + barra([['estatico', n.estatico], ['preset', n.preset], ['dinamico', n.dinamico]]) + '</div>' +
          '<div><div class="eti">la IA escribió ' + p.frases.length + ' frases</div>' + barra([['kit', p.origen.kit], ['anterior', p.origen.anterior], ['creativo', p.origen.creativo], ['imaginado', p.origen.imaginado]]) + '</div></div>';
      }).join('') + '</div>' + ley(['estatico', 'preset', 'dinamico'], NAT) + ley(['kit', 'anterior', 'creativo', 'imaginado'], ORIG) + '</div>';
    h += '<div class="bloque"><h2>Qué hizo con el kit</h2><p class="sub">Cada hecho del producto: si lo usó en algún paso, si le llegó y no lo usó, o si nunca le llegó. Que nunca le llegue no es culpa del modelo: es nuestro.</p>' +
      '<div class="nums"><div class="num"><div class="v" style="color:var(--kit)">' + R.hechos.usados + '</div><p>hechos usados, de ' + R.hechos.total + '</p></div><div class="num"><div class="v" style="color:var(--tinta-2)">' + R.hechos.ignorados + '</div><p>le llegaron y no los usó</p></div><div class="num"><div class="v" style="color:var(--imaginado)">' + R.hechos.noLlegaron + '</div><p>nunca le llegaron</p></div><div class="num"><div class="v" style="color:var(--alerta)">' + R.alertas + '</div><p>alertas</p></div></div>';
    var grupos = {}; D.hechos.forEach(function (x) { (grupos[x.grupo] = grupos[x.grupo] || []).push(x); });
    h += '<div class="grupos">' + Object.keys(grupos).map(function (g) { return '<div class="grupo"><div class="t">' + esc(g) + '</div><div class="hs">' + grupos[g].map(function (x) { return '<span class="h ' + x.estado + '" title="' + esc(x.texto) + '">' + esc(x.etiqueta) + '</span>'; }).join('') + '</div></div>'; }).join('') + '</div>';
    h += '<div class="leyenda"><span><i class="sw" style="background:var(--kit)"></i>lo usó</span><span><i class="sw" style="background:var(--tinta-3)"></i>le llegó y no lo usó (tachado)</span><span><i class="sw" style="background:var(--imaginado)"></i>no le llegó (borde punteado)</span></div></div>';
    var al = []; D.pasos.forEach(function (p) { p.frases.forEach(function (f) { f.alertas.forEach(function (a) { al.push([p.label, f, a]); }); }); });
    h += '<div class="bloque"><h2>Alertas</h2>' + (al.length ? '<ul class="alertas">' + al.map(function (x) { return '<li><b>' + esc(x[0]) + ':</b> ' + esc(x[2]) + '. <span style="color:var(--tinta-2)">"' + esc(x[1].texto.slice(0, 140)) + (x[1].texto.length > 140 ? '…' : '') + '"</span></li>'; }).join('') + '</ul>' : '<p class="sub">Ninguna.</p>') + '</div>';
    return h;
  }

  function paso(p) {
    var h = '<div class="hero"><span class="eti">' + esc(D.pieza.titulo) + '</span><h1>' + esc(p.label) + '</h1>';
    if (p.corrida) h += '<div class="chips"><span class="chip">Molde <b>' + esc(p.corrida.version) + '</b></span><span class="chip">Modelo <b>' + esc(p.corrida.modelo || '?') + '</b></span><span class="chip"><b>' + p.corrida.segundos + ' s</b></span><span class="chip">USD <b>' + p.corrida.costo.toFixed(3) + '</b></span>' + (p.corrida.veces > 1 ? '<span class="chip">corrió <b>' + p.corrida.veces + ' veces</b></span>' : '') + '</div>';
    h += '</div>';
    var dec = p.decisiones || {}; var dk = Object.keys(dec).filter(function (k) { return dec[k] !== null && dec[k] !== '' && dec[k] !== false && ['cache', 'regenerate', 'modeloPedido', 'molde'].indexOf(k) < 0; });
    h += '<div class="dos"><div class="caja"><h3>Lo que decidió la IA</h3><p>' + esc(p.decideLaIA) + '</p></div><div class="caja"><h3>Lo que vino decidido</h3>' + (dk.length ? '<ul>' + dk.map(function (k) { return '<li>' + esc(k) + ': <b style="color:var(--tinta)">' + esc(dec[k]) + '</b></li>'; }).join('') + '</ul>' : '<p>Nada registrado en la corrida.</p>') + '</div></div>';
    h += '<div class="bloque"><h2>De qué se alimentó</h2><p class="sub">Las capas del prompt, en el orden en que le llegaron, y cuánto de cada una aparece en lo que escribió.</p>' + (p.promptReconstruido ? '<div class="aviso">Esta corrida es anterior a que se guardara el prompt: se rearmó hoy con los datos de la pieza y puede diferir en detalles del que se mandó.</div>' : '') +
      '<div class="capas">' + p.capas.map(function (c) { return '<div class="capa" style="border-left-color:' + COL[c.naturaleza] + '"><span class="tt">' + esc(c.titulo) + '</span><span class="pal">' + c.palabras + ' pal</span><span class="uso"><span class="b"><i style="width:' + c.enSalida + '%"></i></span>' + c.enSalida + '% en la salida</span></div>'; }).join('') + '</div>' + ley(['estatico', 'preset', 'dinamico'], NAT) + '</div>';
    h += '<div class="bloque"><h2>Lo que escribió</h2><p class="sub">Frase por frase, de dónde sale. "Lo imaginó" no es malo en sí: es lo que hay que mirar.</p><div class="frases">' + p.frases.map(function (f) {
      return '<div class="frase" style="border-left-color:' + (f.alertas.length ? 'var(--alerta)' : COL[f.origen]) + '"><div class="cab"><span class="orig" style="color:' + COL[f.origen] + '">' + esc(ORIG[f.origen]) + '</span><span>' + esc(f.campo) + (f.n ? ' · ' + f.n : '') + (f.rol ? ' · ' + esc(f.rol) : '') + '</span>' + (f.hecho ? '<span>← ' + esc(f.hecho.etiqueta) + ' (' + f.parecido + '%)</span>' : '') + '</div><div class="tx">' + esc(f.texto) + '</div>' + (f.alertas.length ? '<div class="al">' + f.alertas.map(esc).join(' · ') + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';
    var por = { usado: [], ignorado: [], 'no-llego': [] }; p.hechos.forEach(function (x) { por[x.estado].push(x); });
    h += '<div class="bloque"><h2>Qué hizo con el kit en este paso</h2><div class="dos">' + ['usado', 'ignorado', 'no-llego'].map(function (e) { return '<div class="caja"><h3>' + esc(EST[e].charAt(0).toUpperCase() + EST[e].slice(1)) + ' (' + por[e].length + ')</h3><div class="hs">' + (por[e].length ? por[e].map(function (x) { return '<span class="h ' + e + '">' + esc(x.etiqueta) + '</span>'; }).join('') : '<p>Ninguno.</p>') + '</div></div>'; }).join('') + '</div></div>';
    if (p.descartadas && p.descartadas.length) h += '<div class="bloque"><h2>Las ideas que no se eligieron</h2><div class="dos">' + p.descartadas.map(function (o) { return '<div class="caja"><h3>' + esc(o.titulo || 'Otra idea') + '</h3><p>' + esc(o.idea) + '</p></div>'; }).join('') + '</div></div>';
    return h;
  }

  function plan() {
    var P = D.plan;
    var h = '<div class="hero"><h1>Contra el plan</h1><p>La pieza ' + P.n + ' del plan de campaña: ' + esc(P.objetivo) + ' para ' + esc(P.audiencia.toLowerCase()) + ', ' + esc(P.angulo) + ', tono ' + esc(P.tono.toLowerCase()) + '. Lo que la regla le asignó a cada momento, ¿quedó en el guion y el storyboard?</p>';
    h += '<div class="chips"><span class="chip">Ángulo ' + (P.eligioIgual.angulo ? '<b style="color:var(--kit)">igual al plan</b>' : '<b style="color:var(--alerta)">distinto del plan</b>') + '</span><span class="chip">Tono ' + (P.eligioIgual.tono ? '<b style="color:var(--kit)">igual al plan</b>' : '<b style="color:var(--alerta)">distinto del plan</b>') + '</span></div></div>';
    var marca = function (v) { return v === null ? '<span class="na">no aplica</span>' : v ? '<span class="ok">está</span>' : '<span class="no">falta</span>'; };
    h += '<div class="bloque"><div class="plan">' + P.momentos.map(function (m) { return '<div class="pm"><span><b>' + esc(m.label) + '</b><br><span style="color:var(--tinta-3);font-size:12px">' + esc(m.material) + '</span></span><span class="d" style="color:var(--tinta-2)">' + esc(m.dato) + (m.pantalla ? ' · pantalla: ' + esc(m.pantalla) : '') + '</span><span>dato: ' + marca(m.datoEsta) + '</span><span>pantalla: ' + marca(m.pantallaEsta) + '</span></div>'; }).join('') + '</div></div>';
    return h;
  }

  function pintar() {
    tabs();
    var m = document.getElementById('main');
    if (S.tab === 'resumen') m.innerHTML = resumen();
    else if (S.tab === 'plan') m.innerHTML = plan();
    else m.innerHTML = paso(D.pasos.filter(function (p) { return p.id === S.tab; })[0]);
  }
  pintar();
})();
</script>
