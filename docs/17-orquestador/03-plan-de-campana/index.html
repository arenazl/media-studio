<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Plan de campaña RepareHoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout: barra fija, pestañas arriba (campaña / reglas / para curar); la campaña baja por niveles con migas:
     campaña -> pieza (línea de tiempo por material) -> momento (detalle). Un solo ambiente oscuro, colores por material. */
  :root{
    --noche:#0A1729; --panel:#11253F; --panel-2:#0D1E35; --panel-3:#162C4C;
    --linea:#1D3A5C; --linea-suave:#16304E;
    --tinta:#E8EFF9; --tinta-2:#94ABC8; --tinta-3:#7088A8;
    --marca:#2D7FF9; --ok:#22C55E; --ojo:#F5B342; --no:#FF5A5F;
    --filmada:#FF8A3D; --consecuencia:#F5B342; --mockup:#38BDF8; --texto:#A78BFA; --placa:#22C55E;
    --persona:#FF8A3D; --producto:#38BDF8; --marca-c:#22C55E;
    --ancho:1040px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--noche);color:var(--tinta);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--ancho);margin:0 auto;padding-inline:16px}
  h1,h2,h3{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-weight:700;text-wrap:balance;margin:0}
  p{margin:0}
  .barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,23,41,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea-suave)}
  .barra .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:8px}
  .logo{display:flex;align-items:center;gap:9px}
  .logo svg{width:24px;height:24px;flex:none}
  .logo__n{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{font:inherit;font-size:13.5px;font-weight:600;color:var(--tinta-2);background:transparent;border:1px solid var(--linea);border-radius:999px;padding:7px 14px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--marca);border-color:var(--marca);color:#fff}
  .hero{padding-block:20px 6px}
  .hero h1{font-size:clamp(24px,4.6vw,34px);line-height:1.1}
  .hero p{margin-top:8px;color:var(--tinta-2);max-width:72ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
  .grupo .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--linea);background:var(--panel-2);color:var(--tinta);cursor:pointer}
  .opt[aria-pressed="true"]{border-color:var(--marca);background:#173A6A;font-weight:600}
  .tab:focus-visible,.opt:focus-visible,.pieza:focus-visible,.seg:focus-visible,.mom:focus-visible,.nav button:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
  .nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px 6px}
  .nav button{font:inherit;font-size:13px;font-weight:600;color:var(--tinta);background:var(--panel-2);border:1px solid var(--linea);border-radius:7px;padding:8px 13px;cursor:pointer}
  .nav button[disabled]{opacity:.35;cursor:default}
  .miga{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--tinta-3)}
  .miga b{color:var(--tinta-2);font-weight:500;cursor:pointer}
  .miga b.actual{color:var(--tinta);cursor:default}
  .escena{margin-top:8px;border:1px solid var(--linea-suave);border-radius:12px;background:var(--panel-2);padding:18px;animation:aparece .18s ease}
  @keyframes aparece{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.escena{animation:none}}
  .escena h2{font-size:clamp(20px,3.4vw,26px);line-height:1.15}
  .escena .sub{margin-top:6px;color:var(--tinta-2);font-size:14.5px;max-width:72ch}
  .eti{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}
  /* nivel 0: carriles por audiencia */
  .flujo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px;color:var(--tinta-2)}
  .flujo span.caja{border:1px solid var(--linea);border-radius:8px;padding:6px 10px;background:var(--panel)}
  .flujo span.caja b{color:var(--tinta)}
  .flujo i{font-style:normal;color:var(--marca)}
  .carril{margin-top:16px}
  .carril h3{font-size:17px;display:flex;align-items:center;gap:8px}
  .carril .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--linea);color:var(--tinta-2)}
  .piezas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
  .pieza{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
  .pieza:hover{border-color:var(--marca);background:var(--panel-3)}
  .pieza .obj{display:flex;align-items:center;gap:8px}
  .pieza .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--tinta-3)}
  .pieza .t{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px;line-height:1.15}
  .pieza .pq{font-size:13px;color:var(--tinta-2)}
  .pieza .ang{font-size:14px}
  .pieza .ang b{color:var(--tinta)}
  .pieza .pie{display:flex;justify-content:space-between;font-size:12px;color:var(--tinta-3);font-family:'IBM Plex Mono',monospace}
  .barrita{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
  .barrita i{display:block;height:100%}
  .avisito{font-size:12px;color:var(--ojo)}
  .crudo{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
  .crudo .c{background:var(--noche);border:1px solid var(--linea);border-radius:10px;padding:12px;min-width:0}
  .crudo .n{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1}
  .crudo .c p{font-size:13px;color:var(--tinta-2);margin-top:6px}
  .faltas{margin-top:16px;border:1px solid #5a4416;background:#1d1a10;border-radius:10px;padding:12px 14px}
  .faltas li{font-size:14px;color:#F3DFAE;margin-bottom:4px}
  .faltas ul{margin:6px 0 0;padding-left:18px}
  /* nivel 1: línea de tiempo de la pieza */
  .chipsP{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chipP{font-size:13px;border:1px solid var(--linea);border-radius:999px;padding:4px 10px;color:var(--tinta-2)}
  .chipP b{color:var(--tinta)}
  .linea{display:flex;gap:4px;margin-top:18px;min-height:74px}
  .seg{font:inherit;color:#0A1729;border:0;border-radius:8px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
  .seg .s1{font-weight:700;font-size:13px;line-height:1.15;overflow-wrap:anywhere}
  .seg .s2{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
  .regla{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-3);margin-top:4px}
  .ley{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--tinta-3)}
  .ley span{display:flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .moms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
  .mom{font:inherit;color:inherit;text-align:left;background:var(--noche);border:1px solid var(--linea);border-left-width:5px;border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
  .mom:hover{background:var(--panel-3)}
  .mom .tt{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:16px}
  .mom .mat{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em}
  .mom .dato{font-size:13px;color:var(--tinta-2);overflow-wrap:anywhere}
  .porque{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .caja{background:var(--noche);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;min-width:0}
  .caja h3{font-size:15px;margin-bottom:6px}
  .caja li{font-size:13.5px;color:var(--tinta-2);margin-bottom:4px}
  .caja ul{margin:0;padding-left:18px}
  .caja.av{border-color:#5a4416}
  .caja.av li{color:#F3DFAE}
  /* nivel 2: un momento */
  .det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
  @media (max-width:720px){.det{grid-template-columns:minmax(0,1fr)}}
  .tel{background:var(--noche);border:1px solid var(--linea);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .tel svg{width:140px;height:auto}
  .campo{margin-bottom:10px}
  .campo .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3)}
  .campo .v{font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
  /* reglas */
  .bloque{margin-top:20px}
  .bloque h2{font-size:21px}
  .bloque .sub{color:var(--tinta-2);font-size:14.5px;margin-top:4px;max-width:72ch}
  .objr{display:grid;gap:8px;margin-top:10px}
  .objr .fila{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
  .objr .fila .o{font-weight:700;min-width:120px}
  .objr .fila .q{color:var(--tinta-2);font-size:13px;min-width:120px}
  .pill{font-size:12.5px;border-radius:999px;padding:3px 10px;border:1px solid var(--linea);background:var(--noche)}
  .pill.prim{border-color:var(--marca)}
  .flecha{color:var(--tinta-3);font-size:13px}
  .angs{display:grid;gap:10px;margin-top:10px}
  .angr{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:12px}
  .angr .cab{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
  .angr .cab b{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:17px}
  .angr .cab span{font-size:12.5px;color:var(--tinta-3);font-family:'IBM Plex Mono',monospace}
  .esq{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .esq i{font-style:normal;font-size:12.5px;font-weight:600;color:#0A1729;border-radius:6px;padding:5px 9px}
  .angr .req{font-size:12.5px;color:var(--tinta-2);margin-top:6px}
  .tabla{overflow-x:auto;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea-suave);vertical-align:top}
  th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);font-weight:500}
  .mat-cel{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .lista{margin:10px 0 0;padding-left:20px}
  .lista li{margin-bottom:6px;font-size:14.5px;color:var(--tinta-2)}
  .lista li b{color:var(--tinta)}
  /* para curar */
  .preguntas{display:grid;gap:12px;margin-top:14px}
  .preg{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
  .preg .q{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1.2}
  .preg .hoy{margin-top:6px;font-size:14px;color:var(--tinta-2)}
  .preg .reco{margin-top:8px;font-size:14px;border-left:3px solid var(--ok);padding-left:10px}
  .preg .ok{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#0A1729;background:var(--ok);border-radius:999px;padding:2px 9px}
  .preg .de{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase}
  footer{padding-block:22px 40px}
  footer .txt{font-size:13px;color:var(--tinta-3);max-width:70ch}
</style>
</head>

    h += '<div class="bloque"><h2>2. Cómo se cuenta: los ángulos y sus momentos</h2><p class="sub">Cinco ángulos con nombre de la industria. Cada uno trae sus momentos fijos, y cada momento es de un tipo: persona, producto o marca. El humor ya no es un ángulo: es un tono.</p><div class="angs">' +
      R.angulos.map(function (a) {

          '</div><p class="req">Necesita del kit: ' + esc(rs.join(', ')) + '.</p></div>';
      }).join('') + '</div><div class="ley"><span><i class="sw" style="background:var(--persona)"></i>persona</span><span><i class="sw" style="background:var(--producto)"></i>producto</span><span><i class="sw" style="background:var(--marca-c)"></i>marca</span></div></div>';
    var tipos = ['persona', 'producto', 'marca'];
    h += '<div class="bloque"><h2>3. Con qué se hace cada momento: el material</h2><p class="sub">La regla de oro: nunca se filma una pantalla. La persona se filma; el producto es el mockup real; el cierre es la placa.</p><div class="tabla"><table><thead><tr><th>Momento de</th>' +
      FORMATOS.map(function (f) { return '<th>' + f[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
      tipos.map(function (t) { return '<tr><td><b>' + t + '</b><br><span style="color:var(--tinta-3);font-size:12.5px">' + esc(R.tiposDeMomento[t]) + '</span></td>' + FORMATOS.map(function (f) { var m = R.material[f[0]][t]; return '<td><span class="mat-cel"><i class="sw" style="background:' + COLMAT[m] + '"></i>' + esc(matLabel(m)) + '</span></td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div><div class="tabla"><table><thead><tr><th>Material</th><th>Qué es</th><th>Duración</th></tr></thead><tbody>' +
      Object.keys(R.materiales).map(function (k) { var m = R.materiales[k]; return '<tr><td><span class="mat-cel"><i class="sw" style="background:' + COLMAT[k] + '"></i>' + esc(m.label) + '</span></td><td>' + esc(m.dice) + '</td><td style="white-space:nowrap">' + m.dur.min + ' a ' + m.dur.max + ' s</td></tr>'; }).join('') +

  // ── navegación ──────────────────────────────────────────────────────────────────────────────────────────────────

      h += '<div class="hero"><h1>Plan de campaña, sin generar nada</h1><p>La regla lee el kit de la app y arma la campaña entera: qué piezas, para qué, a quién, con qué ángulo, y cada momento con su material. Mismo kit, mismo plan, siempre. Probalo con otra app o con otro formato.</p>' + selectores() + '</div>';
      h += nav();
      var e = S.pila[S.pila.length - 1];

      if (e.tipo === 'campana') h += escenaCampana();

      else h += escenaMomento(P.piezas[e.n - 1], e.i);

    main.querySelectorAll('[data-app]').forEach(function (b) { b.addEventListener('click', function () { S.app = b.getAttribute('data-app'); S.pila = [{ tipo: 'campana' }]; pintar(); }); });
    main.querySelectorAll('[data-fmt]').forEach(function (b) { b.addEventListener('click', function () { S.formato = b.getAttribute('data-fmt'); var e = S.pila[S.pila.length - 1]; if (e.tipo !== 'campana' && !plan().piezas[e.n - 1]) S.pila = [{ tipo: 'campana' }]; else if (e.tipo === 'momento' && !plan().piezas[e.n - 1].momentos[e.i]) S.pila = S.pila.slice(0, 2); pintar(); }); });
    main.querySelectorAll('[data-pieza]').forEach(function (b) { b.addEventListener('click', function () { S.pila.push({ tipo: 'pieza', n: +b.getAttribute('data-pieza') }); pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });
    main.querySelectorAll('[data-mom]').forEach(function (b) { b.addEventListener('click', function () { var e = S.pila[S.pila.length - 1]; S.pila.push({ tipo: 'momento', n: e.n, i: +b.getAttribute('data-mom') }); pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });
    main.querySelectorAll('.miga b[data-i]').forEach(function (b) { b.addEventListener('click', function () { var i = +b.getAttribute('data-i'); if (i < S.pila.length - 1) { S.pila = S.pila.slice(0, i + 1); pintar(); } }); });
    var v = document.getElementById('volver'); if (v) v.addEventListener('click', function () { if (S.pila.length > 1) { S.pila.pop(); pintar(); } });
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { S.tab = t.getAttribute('data-tab'); pintar(); window.scrollTo({ top: 0 }); }); });
  pintar();
})();
</script>

</body>
</html>
